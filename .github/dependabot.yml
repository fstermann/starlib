version: 2

updates:
  # Python (uv) - root pyproject.toml
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    groups:
      backend:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      backend-security:
        applies-to: security-updates
        patterns: ["*"]

  # npm - frontend
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    groups:
      frontend:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      frontend-security:
        applies-to: security-updates
        patterns: ["*"]

  # npm - desktop
  - package-ecosystem: "npm"
    directory: "/desktop"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    groups:
      desktop:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      desktop-security:
        applies-to: security-updates
        patterns: ["*"]

  # Cargo - workspace root, so manifest bumps also update the root Cargo.lock
  # and every member (desktop/src-tauri, starlib_audio) is covered.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    groups:
      cargo:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      cargo-security:
        applies-to: security-updates
        patterns: ["*"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # pre-commit hooks
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    groups:
      pre-commit:
        patterns: ["*"]
        update-types: ["minor", "patch"]
